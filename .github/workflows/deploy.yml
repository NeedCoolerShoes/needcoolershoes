name: Production Deploy
on:
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Revision Hash
        id: hash
        run: echo NCRS_VERSION=$(git rev-parse --short HEAD | tr -d '\n') >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_PATH }}
          build-args: NCRS_VERSION=${{ env.NCRS_VERSION }}
      
      - name: Trigger Swiftwave Deploy
        id: swiftwave
        shell: bash
        env:
          SWIFTWAVE_WEBHOOK: ${{ secrets.SWIFTWAVE_PRODUCTION_WEBHOOK }}
          IMAGE_TAG: ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_PATH }}
        run: curl -d $IMAGE_TAG $SWIFTWAVE_WEBHOOK

