  <p><span id="quip">Not all roads lead to Rome...This one surely didn't</span> <a href="/" class="underline">Return Home</a></p>

    const quips = [
      "Not all roads lead to Rome...This one surely didn't",
      "Wouldya like a cuppa mate?",

    quipSpan.innerText = quip;
